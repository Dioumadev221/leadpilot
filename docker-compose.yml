services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadpilot
      POSTGRES_PASSWORD: leadpilot
      POSTGRES_DB: leadpilot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadpilot"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://leadpilot:leadpilot@db:5432/leadpilot
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
