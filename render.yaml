# One-click deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: leadpilot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: leadpilot-db, property: connectionString }
      - key: API_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: CRM_PROVIDER
        value: mock
      - key: LLM_PROVIDER
        value: none
      - key: OPENAI_API_KEY
        sync: false
      - key: HUBSPOT_TOKEN
        sync: false

databases:
  - name: leadpilot-db
    plan: free
    databaseName: leadpilot
