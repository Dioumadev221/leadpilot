<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadPilot · Approval Console</title>
<style>
  :root { --bg:#0b0d12; --panel:#12151c; --line:#232836; --text:#e6e8ee; --muted:#8b93a7; --accent:#6d8cff;
          --hot:#ff5d5d; --warm:#ffb547; --cold:#5db2ff; --ok:#3ecf8e; --spam:#6b7280; }
  * { box-sizing:border-box } body { margin:0; font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text) }
  header { display:flex; align-items:center; gap:16px; padding:14px 22px; border-bottom:1px solid var(--line); flex-wrap:wrap }
  header h1 { font-size:17px; margin:0 } header h1 span { color:var(--accent) }
  .pill { padding:2px 9px; border-radius:99px; font-size:12px; border:1px solid var(--line); color:var(--muted) }
  nav { display:flex; gap:6px; margin-left:auto }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; font:inherit }
  button:hover { border-color:var(--accent) } button.primary { background:var(--accent); border-color:var(--accent); color:#fff }
  button.danger { color:var(--hot) } button.active { border-color:var(--accent); color:var(--accent) }
  input, textarea, select { width:100%; background:#0e1117; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit }
  textarea { min-height:90px; resize:vertical }
  main { display:grid; grid-template-columns:minmax(300px,420px) 1fr; height:calc(100vh - 58px) }
  #list { border-right:1px solid var(--line); overflow:auto }
  .filters { display:flex; gap:6px; padding:12px; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line) }
  .filters button { padding:4px 10px; font-size:12px }
  .row { padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; display:grid; grid-template-columns:44px 1fr; gap:10px }
  .row:hover, .row.sel { background:var(--panel) }
  .score { width:44px; height:44px; border-radius:10px; display:grid; place-items:center; font-weight:700; font-size:15px; background:#1a1f2b }
  .t-hot{color:var(--hot)} .t-warm{color:var(--warm)} .t-cold{color:var(--cold)} .t-spam{color:var(--spam)}
  .row .who { font-weight:600 } .row .sub { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .status { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted) }
  .status.synced{color:var(--ok)} .status.pending_approval{color:var(--warm)} .status.rejected,.status.auto_rejected,.status.failed{color:var(--spam)}
  #detail { overflow:auto; padding:22px 28px }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px }
  .card h3 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted) }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px }
  .kv { display:grid; grid-template-columns:130px 1fr; gap:4px 10px } .kv div:nth-child(odd){ color:var(--muted) }
  .bd { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed var(--line) }
  .pos{color:var(--ok)} .neg{color:var(--hot)}
  .actions { display:flex; gap:8px; margin-top:12px }
  .muted { color:var(--muted) } .empty { padding:60px; text-align:center; color:var(--muted) }
  .events div { font-size:12px; color:var(--muted); padding:2px 0 } .events b { color:var(--text); font-weight:500 }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:14px }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px }
  .kpi b { display:block; font-size:24px } .kpi span { color:var(--muted); font-size:12px }
  ul { margin:6px 0; padding-left:18px } label { display:block; margin:10px 0 4px; color:var(--muted); font-size:12px }
  .warn { color:var(--warm); font-size:12px }
  @media (max-width:820px){ main{grid-template-columns:1fr; height:auto} #list{max-height:45vh} .grid2{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>Lead<span>Pilot</span></h1>
  <span class="pill" id="meta">…</span>
  <nav>
    <button id="tab-leads" class="active" onclick="showLeads()">Approval queue</button>
    <button id="tab-report" onclick="showReport()">Weekly report</button>
    <button onclick="showNew()">+ Test lead</button>
    <button onclick="setKey()" title="API key">🔑</button>
  </nav>
</header>
<main>
  <section id="list">
    <div class="filters" id="filters"></div>
    <div id="rows"></div>
  </section>
  <section id="detail"><div class="empty">Select a lead</div></section>
</main>
<script>
const FILTERS = [["pending_approval","To review"],["synced","In CRM"],["rejected","Rejected"],["auto_rejected","Spam"],["","All"]];
let filter = "pending_approval", selected = null, timer = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function key(){ try { return localStorage.getItem("lp_key") || "" } catch { return "" } }
function setKey(){ const k = prompt("API key (X-API-Key)", key()); if (k !== null) { try { localStorage.setItem("lp_key", k) } catch {} load() } }
async function api(path, opts={}) {
  const r = await fetch(path, {...opts, headers: {"Content-Type":"application/json","X-API-Key":key(), ...(opts.headers||{})}});
  if (r.status === 401) { setKey(); throw new Error("unauthorized") }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail ? JSON.stringify(body.detail) : r.statusText);
  return body;
}
function renderFilters(){
  $("filters").innerHTML = FILTERS.map(([v,l]) => `<button class="${v===filter?'active':''}" onclick="filter='${v}';load()">${l}</button>`).join("");
}
async function load(){
  renderFilters();
  try {
    const st = await api("/api/stats");
    $("meta").textContent = `CRM: ${st.crm} · agents: ${st.llm} · ${st.by_status.pending_approval||0} to review`;
    const leads = await api("/api/leads" + (filter ? `?status=${filter}` : ""));
    $("rows").innerHTML = leads.length ? leads.map(l => `
      <div class="row ${l.id===selected?'sel':''}" onclick="openLead(${l.id})">
        <div class="score t-${l.tier||''}">${l.score ?? "…"}</div>
        <div><div class="who">${esc(l.company || l.email)} <span class="status ${l.status}">· ${l.status.replace("_"," ")}</span></div>
        <div class="sub">${esc((l.qualification||{}).use_case || "processing")} — ${esc((l.qualification||{}).need_summary || l.message)}</div></div>
      </div>`).join("") : `<div class="empty">Nothing here.</div>`;
  } catch(e) { $("rows").innerHTML = `<div class="empty">${esc(e.message)}</div>` }
}
async function openLead(id){
  selected = id; showLeads(false);
  const l = await api(`/api/leads/${id}`), q = l.qualification || {}, e = l.enrichment || {}, d = l.crm_draft || {}, site = e.site || {};
  const editable = l.status === "pending_approval";
  $("detail").innerHTML = `
    <div class="card"><div style="display:flex;align-items:center;gap:14px">
      <div class="score t-${l.tier}" style="width:58px;height:58px;font-size:20px">${l.score ?? "…"}</div>
      <div><div style="font-size:18px;font-weight:600">${esc([l.first_name,l.last_name].filter(Boolean).join(" ") || l.email)} · ${esc(l.company||"")}</div>
      <div class="muted">${esc(l.job_title||"")} · ${esc(l.email)} · via ${esc(l.source)} · <span class="status ${l.status}">${l.status}</span>
      ${l.crm_id ? ` · ${esc(l.crm_provider)} #${esc(l.crm_id)}` : ""}</div></div></div>
      <p style="white-space:pre-wrap;margin:14px 0 0">${esc(l.message)}</p>
      ${(l.warnings||[]).map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join("")}
      ${l.last_error ? `<div class="warn">Error: ${esc(l.last_error)}</div>` : ""}
    </div>
    <div class="grid2">
      <div class="card"><h3>Qualifier agent · ${esc(q.mode||"")}</h3><div class="kv">
        <div>Use case</div><div>${esc(q.use_case)}</div><div>Intent</div><div>${esc(q.intent)}</div>
        <div>ICP fit</div><div>${esc(q.icp_fit)}</div><div>Budget</div><div>${esc(q.budget_amount || q.budget_signal)}</div>
        <div>Timeline</div><div>${esc(q.timeline)}</div><div>Next step</div><div>${esc(q.recommended_action)}</div></div>
        <p class="muted" style="margin-bottom:0">${esc(q.reasoning)}</p></div>
      <div class="card"><h3>Score breakdown (deterministic)</h3>
        ${(l.score_breakdown||[]).map(i=>`<div class="bd"><span>${esc(i.why)}</span><b class="${i.points>0?'pos':'neg'}">${i.points>0?'+':''}${i.points}</b></div>`).join("")}
        <h3 style="margin-top:16px">Enrichment</h3><div class="kv">
        <div>Domain</div><div>${esc(e.email_domain)} (${esc(e.domain_type)})</div>
        <div>Website</div><div>${esc(e.website||"—")} ${site.reachable===false?'<span class="warn">unreachable</span>':''}</div>
        <div>Site title</div><div>${esc(site.title||"—")}</div></div></div>
    </div>
    ${l.crm_draft ? `<div class="card"><h3>Writer agent · draft for CRM ${editable ? "(editable)" : ""}</h3>
      <label>CRM stage</label><select id="stage" ${editable?"":"disabled"}>${["sql","mql","lead"].map(s=>`<option ${d.stage===s?"selected":""}>${s}</option>`).join("")}</select>
      <label>CRM note</label><textarea id="note" ${editable?"":"disabled"}>${esc(d.note)}</textarea>
      <label>Reply subject</label><input id="subj" value="${esc(d.reply_subject)}" ${editable?"":"disabled"}>
      <label>Reply email</label><textarea id="body" style="min-height:170px" ${editable?"":"disabled"}>${esc(d.reply_body)}</textarea>
      ${editable ? `<div class="actions"><button class="primary" onclick="approve(${l.id})">Approve → push to CRM</button>
        <button class="danger" onclick="reject(${l.id})">Reject</button></div>` : ""}</div>` : ""}
    <div class="card events"><h3>Audit trail</h3>${(l.events||[]).map(ev=>`<div>${new Date(ev.at).toLocaleString()} · <b>${esc(ev.kind)}</b> ${esc(JSON.stringify(ev.detail))}</div>`).join("")}</div>`;
  load();
}
async function approve(id){
  try { await api(`/api/leads/${id}/approve`, {method:"POST", body: JSON.stringify({reviewer:"console",
    stage:$("stage").value, note:$("note").value, reply_subject:$("subj").value, reply_body:$("body").value})}); openLead(id) }
  catch(e){ alert(e.message) }
}
async function reject(id){
  const reason = prompt("Reason?", "Not a fit"); if (reason === null) return;
  try { await api(`/api/leads/${id}/reject`, {method:"POST", body: JSON.stringify({reviewer:"console", reason})}); openLead(id) }
  catch(e){ alert(e.message) }
}
function showLeads(reset=true){ $("tab-leads").className="active"; $("tab-report").className=""; if(reset && !selected) $("detail").innerHTML='<div class="empty">Select a lead</div>' }
async function showReport(){
  $("tab-leads").className=""; $("tab-report").className="active";
  let r; try { r = await api("/api/reports/latest") } catch { r = null }
  const m = r?.metrics, n = r?.narrative;
  $("detail").innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h2 style="margin:0">${r ? esc(n.headline) : "No report yet"}</h2><button class="primary" onclick="genReport()">Generate now</button></div>
    ${r ? `<p class="muted">${new Date(r.period_start).toLocaleDateString()} → ${new Date(r.period_end).toLocaleDateString()} · analyst agent: ${esc(n.mode)}</p>
    <div class="kpis">
      <div class="kpi"><b>${m.total_leads}</b><span>leads${m.wow_change_pct!=null?` (${m.wow_change_pct>0?"+":""}${m.wow_change_pct}% WoW)`:""}</span></div>
      <div class="kpi"><b class="t-hot">${m.by_tier.hot||0}</b><span>hot</span></div>
      <div class="kpi"><b>${m.avg_score ?? "—"}</b><span>avg score</span></div>
      <div class="kpi"><b class="pos">${m.synced_to_crm}</b><span>pushed to CRM</span></div>
      <div class="kpi"><b>${m.spam_filtered}</b><span>spam filtered</span></div>
      <div class="kpi"><b>${m.median_hours_to_review ?? "—"}h</b><span>median review time</span></div></div>
    <div class="card"><h3>Summary</h3><p>${esc(n.summary)}</p>
      ${n.risks?.length ? `<h3>Risks</h3><ul>${n.risks.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
      <h3>Actions for next week</h3><ul>${n.actions.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div class="grid2"><div class="card"><h3>Top use cases</h3>${Object.entries(m.top_use_cases).map(([k,v])=>`<div class="bd"><span>${esc(k)}</span><b>${v}</b></div>`).join("")}</div>
    <div class="card"><h3>Sources</h3>${Object.entries(m.by_source).map(([k,v])=>`<div class="bd"><span>${esc(k)}</span><b>${v}</b></div>`).join("")}</div></div>` : ""}`;
}
async function genReport(){ try { await api("/api/reports/generate", {method:"POST"}); showReport() } catch(e){ alert(e.message) } }
function showNew(){
  selected = null;
  $("detail").innerHTML = `<div class="card" style="max-width:640px"><h3>Submit a test lead</h3>
    <div class="grid2"><div><label>Email *</label><input id="n_email" value="cto@acme-robotics.com"></div>
    <div><label>Company</label><input id="n_company" value="Acme Robotics"></div>
    <div><label>First name</label><input id="n_first" value="Alex"></div><div><label>Job title</label><input id="n_title" value="CTO"></div></div>
    <label>Message</label><textarea id="n_msg">We need an AI agent that answers support tickets from our docs and escalates to humans. Budget $10k, need it live next month.</textarea>
    <div class="actions"><button class="primary" onclick="submitLead()">Send to pipeline</button></div></div>`;
}
async function submitLead(){
  try {
    const l = await api("/api/leads", {method:"POST", body: JSON.stringify({email:$("n_email").value, company:$("n_company").value,
      first_name:$("n_first").value, job_title:$("n_title").value, message:$("n_msg").value, source:"console"})});
    filter = ""; setTimeout(() => openLead(l.id), 1500);
  } catch(e){ alert(e.message) }
}
load(); timer = setInterval(load, 8000);
</script>
</body>
</html>
